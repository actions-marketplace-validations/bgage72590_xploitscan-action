name: 'XploitScan Security Scanner'
description: 'Security scanner for AI-generated code. 30 core rules (223 with Pro). Outputs SARIF for GitHub Security tab.'
author: 'Cipherline LLC'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  path:
    description: 'Path to scan (default: current directory)'
    required: false
    default: '.'
  fail-on:
    description: 'Fail the action if graded findings (critical, high, medium, low — not info) of this severity or higher are found: critical, high, medium, low, none (default: none)'
    required: false
    default: 'none'
  sarif-file:
    description: 'Path to write SARIF output (default: xploitscan-results.sarif)'
    required: false
    default: 'xploitscan-results.sarif'
  comment:
    description: 'Post a summary comment on pull requests (default: true)'
    required: false
    default: 'true'
  api-key:
    description: 'XploitScan API key (xpls_...) — generate one in Settings → API Keys. Required to unlock the full 223-rule Pro set; without it the action runs the 30 free rules.'
    required: false
    default: ''
  fail-on-quality:
    description: 'Also fail the action on high-severity code-quality findings (QA…). Off by default: quality findings are reported either way, and the exit code is a contract with pipelines that were passing before they existed. See https://xploitscan.com/quality'
    required: false
    default: 'false'
  grade-vendored:
    description: 'Count findings in vendored, generated, and documentation files (components/ui, __generated__, *.md) toward the grade and the failure threshold. Off by default — those findings are reported and uploaded to the Security tab either way. Set to true if you treat vendored code as yours to maintain. NOTE: this input is what the action grades by; `scan.gradeVendored` in .xploitscanrc does not apply here, because the action recomputes the grade from the scan JSON rather than using the CLI''s.'
    required: false
    default: 'false'
  anthropic-api-key:
    description: 'Optional Anthropic API key. When set, findings are run through XploitScan''s AI false-positive filter (uses Claude Haiku, ~$0.01 per scan). Reduces noise on CI runs. Get one at https://console.anthropic.com.'
    required: false
    default: ''

# A composite action only exposes an output if the entry carries a `value:`
# mapping — a `description:` alone silently yields the empty string. All eight
# of these were description-only, so every documented output of this action has
# always resolved to "". Nothing caught it because the action's own PR comment
# reads the internal step outputs directly; the first external consumer was
# .github/workflows/security-scan.yml, which rendered "Grade **true**".
outputs:
  grade:
    description: 'Security grade (A+ to F)'
    value: ${{ steps.scan.outputs.grade }}
  score:
    description: 'Security score (0-100)'
    value: ${{ steps.scan.outputs.score }}
  findings-count:
    description: 'Total number of findings, including ones not counted toward the grade'
    value: ${{ steps.scan.outputs.findings-count }}
  graded-findings-count:
    description: 'Findings that count toward the grade (excludes vendored/generated/documentation files). Includes info findings, which never fail the build.'
    value: ${{ steps.scan.outputs.graded-findings-count }}
  ungraded-count:
    description: 'Findings in vendored, generated, or documentation files. Reported and uploaded in the SARIF, but not counted toward the grade or the failure threshold.'
    value: ${{ steps.scan.outputs.ungraded-count }}
  quality-count:
    description: 'Code-quality findings (QA…). Never counted toward the grade or the severity counts; see fail-on-quality.'
    value: ${{ steps.scan.outputs.quality-count }}
  quality-high-count:
    description: 'Code-quality findings at high severity or above.'
    value: ${{ steps.scan.outputs.quality-high-count }}
  critical-count:
    description: 'Number of critical findings'
    value: ${{ steps.scan.outputs.critical-count }}
  high-count:
    description: 'Number of high findings'
    value: ${{ steps.scan.outputs.high-count }}
  medium-count:
    description: 'Number of medium findings'
    value: ${{ steps.scan.outputs.medium-count }}
  low-count:
    description: 'Number of low findings'
    value: ${{ steps.scan.outputs.low-count }}
  sarif-file:
    description: 'Path to the SARIF output file'
    value: ${{ steps.scan.outputs.sarif-file }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '22'

    - name: Run XploitScan
      id: scan
      shell: bash
      env:
        XPLOITSCAN_API_KEY: ${{ inputs.api-key }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_GRADE_VENDORED: ${{ inputs.grade-vendored }}
        INPUT_SARIF_FILE: ${{ inputs.sarif-file }}
      run: |
        # Install xploitscan. Belt-and-suspenders fallback chain:
        #   1) Try `npm install -g` — fastest path when the runner allows
        #      global installs.
        #   2) Fall back to `npx --yes` which installs to a temp prefix
        #      (works even when global install is restricted).
        #   3) Trailing `|| true` swallows any residual error — a broken
        #      published CLI (like the workspace:* spec incident on 1.0.16)
        #      must never block a customer's CI. The scan commands below
        #      already `|| true` their own failures; this keeps the install
        #      stage consistent so `bash -e` can't kill the whole step
        #      before the scan commands get a chance to run.
        npm install -g xploitscan@^1.0.0 2>/dev/null || npx --yes xploitscan@^1.0.0 --version 2>/dev/null || true

        # If an Anthropic key is provided, let the CLI run its AI false-positive filter.
        # Otherwise skip the AI path entirely (matches prior behavior).
        if [ -n "$ANTHROPIC_API_KEY" ]; then
          AI_FLAG=""
        else
          AI_FLAG="--no-ai"
        fi

        # Run scan with JSON output to a temp file (exit code 1 = findings found, not an error)
        SCAN_JSON=$(mktemp)
        npx --yes xploitscan@^1.0.0 scan "$INPUT_PATH" --format json $AI_FLAG 1>"$SCAN_JSON" 2>/dev/null || true

        # Parse results — compute grade/score/counts from findings since CLI JSON doesn't include them
        eval "$(node -e "
          try {
            const j = JSON.parse(require('fs').readFileSync('$SCAN_JSON', 'utf8'));
            const all = j.findings || [];
            // Findings the CLI flagged as vendored (shadcn/ui primitives under
            // components/ui, .md docs, __generated__ output) are reported but
            // not graded — see packages/shared-rules/src/vendored.ts. Grading
            // them here would red-line CI on scaffold code every project on
            // the platform ships byte-identically. They stay in FINDINGS and
            // in the SARIF upload; only the grade and the gate skip them.
            const gradeVendored = process.env.INPUT_GRADE_VENDORED === 'true';
            const f = gradeVendored ? all : all.filter(x => !x.vendored);
            const ungraded = all.length - f.length;
            const critical = f.filter(x => x.severity === 'critical').length;
            const high = f.filter(x => x.severity === 'high').length;
            const medium = f.filter(x => x.severity === 'medium').length;
            const low = f.filter(x => x.severity === 'low').length;
            const total = all.length;
            const gradedTotal = f.length;
            const files = j.filesScanned || 0;
            // Quality findings ride in their OWN key and are deliberately
            // absent from every number above: they do not move the grade, the
            // severity counts, or the default gate. Counted here only so the
            // summary can mention them and fail-on-quality can act on them.
            const quality = j.quality || [];
            const qualityHigh = quality.filter(x => x.severity === 'critical' || x.severity === 'high').length;
            // Scoring matches the web dashboard modal and the CLI calculateGrade function.
            // Keep all three in sync — changing one without the others will produce
            // inconsistent grades between CI, terminal, and the web UI.
            const score = Math.max(0, 100 - (critical * 15) - (high * 7) - (medium * 3) - (low * 1));
            let grade = score >= 97 ? 'A+' : score >= 90 ? 'A' : score >= 80 ? 'B' : score >= 70 ? 'C' : score >= 60 ? 'D' : 'F';
            // Severity caps — a scan with serious findings cannot earn a clean grade
            // regardless of score math.
            const order = ['A+', 'A', 'B', 'C', 'D', 'F'];
            const capTo = (cap) => { if (order.indexOf(grade) < order.indexOf(cap)) grade = cap; };
            if (critical >= 1) capTo('D');
            else if (high >= 3) capTo('D');
            else if (high >= 1) capTo('B');
            else if (medium >= 5) capTo('B');
            else if (medium >= 1) capTo('A');
            console.log('GRADE=' + grade);
            console.log('SCORE=' + score);
            console.log('FINDINGS=' + total);
            console.log('GRADED_FINDINGS=' + gradedTotal);
            console.log('CRITICAL=' + critical);
            console.log('HIGH=' + high);
            console.log('MEDIUM=' + medium);
            console.log('LOW=' + low);
            console.log('UNGRADED=' + ungraded);
            console.log('QUALITY=' + quality.length);
            console.log('QUALITY_HIGH=' + qualityHigh);
          } catch(e) {
            console.log('GRADE=?');
            console.log('SCORE=0');
            console.log('FINDINGS=0');
            console.log('GRADED_FINDINGS=0');
            console.log('CRITICAL=0');
            console.log('HIGH=0');
            console.log('MEDIUM=0');
            console.log('LOW=0');
            console.log('UNGRADED=0');
            console.log('QUALITY=0');
            console.log('QUALITY_HIGH=0');
          }
        ")"
        rm -f "$SCAN_JSON"

        echo "quality-count=$QUALITY" >> $GITHUB_OUTPUT
        echo "quality-high-count=$QUALITY_HIGH" >> $GITHUB_OUTPUT
        echo "grade=$GRADE" >> $GITHUB_OUTPUT
        echo "score=$SCORE" >> $GITHUB_OUTPUT
        echo "findings-count=$FINDINGS" >> $GITHUB_OUTPUT
        echo "graded-findings-count=$GRADED_FINDINGS" >> $GITHUB_OUTPUT
        echo "critical-count=$CRITICAL" >> $GITHUB_OUTPUT
        echo "high-count=$HIGH" >> $GITHUB_OUTPUT
        echo "medium-count=$MEDIUM" >> $GITHUB_OUTPUT
        echo "low-count=$LOW" >> $GITHUB_OUTPUT
        echo "ungraded-count=$UNGRADED" >> $GITHUB_OUTPUT
        echo "sarif-file=$INPUT_SARIF_FILE" >> $GITHUB_OUTPUT

        # Generate SARIF output (exit code 1 = findings found, not an error)
        npx --yes xploitscan@^1.0.0 scan "$INPUT_PATH" --format sarif $AI_FLAG > "$INPUT_SARIF_FILE" 2>/dev/null || true
        # If SARIF file is empty or doesn't exist, write a valid empty SARIF
        if [ ! -s "$INPUT_SARIF_FILE" ]; then
          echo '{"version":"2.1.0","$schema":"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/main/sarif-2.1/schema/sarif-schema-2.1.0.json","runs":[{"tool":{"driver":{"name":"XploitScan","version":"1.0.0","rules":[]}},"results":[]}]}' > "$INPUT_SARIF_FILE"
        fi

        # Print summary
        echo ""
        echo "================================="
        echo "XploitScan Results: Grade $GRADE ($SCORE/100)"
        echo "Findings: $FINDINGS total, $GRADED_FINDINGS graded (Critical: $CRITICAL, High: $HIGH, Medium: $MEDIUM, Low: $LOW)"
        if [ "${UNGRADED:-0}" -gt 0 ] 2>/dev/null; then
          echo "Not graded: $UNGRADED finding(s) in vendored, generated, or documentation files"
        fi
        echo "================================="

        # Also run terminal output for readable logs (exit code 1 = findings, not error)
        npx --yes xploitscan@^1.0.0 scan "$INPUT_PATH" $AI_FLAG 2>&1 || true

    - name: Upload SARIF to GitHub Security
      if: hashFiles(inputs.sarif-file) != ''
      uses: github/codeql-action/upload-sarif@9f759ee644a3e7c15c1390abf49868036c00067b # v3.38.3
      with:
        sarif_file: ${{ inputs.sarif-file }}
      continue-on-error: true

    - name: Post PR Comment
      if: github.event_name == 'pull_request' && inputs.comment == 'true'
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
      env:
        SCAN_GRADE: ${{ steps.scan.outputs.grade }}
        SCAN_SCORE: ${{ steps.scan.outputs.score }}
        SCAN_FINDINGS: ${{ steps.scan.outputs.findings-count }}
        SCAN_CRITICAL: ${{ steps.scan.outputs.critical-count }}
        SCAN_HIGH: ${{ steps.scan.outputs.high-count }}
        SCAN_MEDIUM: ${{ steps.scan.outputs.medium-count }}
        SCAN_LOW: ${{ steps.scan.outputs.low-count }}
        SCAN_UNGRADED: ${{ steps.scan.outputs.ungraded-count }}
      with:
        script: |
          const grade = process.env.SCAN_GRADE;
          const score = process.env.SCAN_SCORE;
          const findings = process.env.SCAN_FINDINGS;
          const critical = process.env.SCAN_CRITICAL;
          const high = process.env.SCAN_HIGH;
          const medium = process.env.SCAN_MEDIUM;
          const low = process.env.SCAN_LOW;
          // Severity rows count graded findings; `findings` is the all-in
          // total. Report the difference explicitly so the table can never
          // look like it lost findings.
          const ungraded = process.env.SCAN_UNGRADED;

          const gradeEmoji = {'A+':'🟢','A':'🟢','B':'🟡','C':'🟠','D':'🔴','F':'🔴'}[grade] || '⚪';
          const noCodeScanned = grade === '?' && score === '0' && findings === '0';

          const body = noCodeScanned ? [
            `## ⚪ XploitScan Security Report`,
            ``,
            `> **No scannable code found in this PR.** This PR may only contain config, docs, or text changes. XploitScan analyzes source code files (JS, TS, Python, Go, etc.) — non-code changes are automatically skipped.`,
            ``,
            `---`,
            `*Scanned with [XploitScan](https://xploitscan.com) — 30 core security rules for AI-generated code (up to 223 with Pro)*`,
          ].join('\n') : [
            `## ${gradeEmoji} XploitScan Security Report`,
            ``,
            `**Grade: ${grade}** | Score: ${score}/100 | ${findings} finding${findings === '1' ? '' : 's'}`,
            ...(Number(ungraded) > 0 ? [``, `> ${ungraded} finding${ungraded === '1' ? '' : 's'} in vendored, generated, or documentation files ${ungraded === '1' ? 'is' : 'are'} in the Security tab but ${ungraded === '1' ? 'is' : 'are'} not counted in the grade or the table below.`] : []),
            ``,
            `| Severity | Count |`,
            `|----------|-------|`,
            `| 🔴 Critical | ${critical} |`,
            `| 🟠 High | ${high} |`,
            `| 🟡 Medium | ${medium} |`,
            `| 🔵 Low | ${low} |`,
            ``,
            findings === '0'
              ? '> No security issues detected.'
              : `> Run \`npx xploitscan scan .\` locally for full details with fix suggestions.`,
            ``,
            `---`,
            `*Scanned with [XploitScan](https://xploitscan.com) — 30 core security rules for AI-generated code (up to 223 with Pro)*`,
          ].join('\n');

          // Find existing comment to update (avoid duplicates)
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          const existing = comments.find(c => c.body && c.body.includes('XploitScan Security Report'));

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
          }
      continue-on-error: true

    - name: Check failure threshold
      shell: bash
      env:
        FAIL_ON: ${{ inputs.fail-on }}
        CRITICAL: ${{ steps.scan.outputs.critical-count }}
        HIGH: ${{ steps.scan.outputs.high-count }}
        MEDIUM: ${{ steps.scan.outputs.medium-count }}
        LOW: ${{ steps.scan.outputs.low-count }}
        # The gate counts graded findings only (critical/high/medium/low).
        # Info never fails the build. Vendored/generated/docs findings are
        # reported and uploaded, but a shadcn/ui primitive that ships
        # byte-identically in every project on the platform must not
        # red-line everyone's CI. See packages/shared-rules/src/vendored.ts.
        UNGRADED: ${{ steps.scan.outputs.ungraded-count }}
        # Quality findings gate only when asked, and independently of fail-on.
        # They are a different question from "is this safe to ship", so they get
        # their own switch rather than riding on the security threshold — and
        # this check runs even when fail-on is `none`, because opting into one
        # is not opting into the other.
        QUALITY_HIGH: ${{ steps.scan.outputs.quality-high-count }}
        FAIL_ON_QUALITY: ${{ inputs.fail-on-quality }}
      run: bash "$GITHUB_ACTION_PATH/check-failure-threshold.sh"
